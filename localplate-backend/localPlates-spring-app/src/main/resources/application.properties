spring.application.name=LocalPlates

# Use in-memory H2 database for local development to avoid external DB failures
spring.datasource.url=jdbc:h2:mem:localplates;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# Hibernate / JPA
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=update

# Enable H2 console for debugging (http://localhost:8080/h2-console)
spring.h2.console.enabled=true

# Allow verbose startup logs during development
logging.level.root=INFO


# MySQL Datasource Config (disabled for local development)
#spring.datasource.url=jdbc:mysql://localhost:3306/localplates_auth?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
#spring.datasource.username=plates_admin
#spring.datasource.password=platespassword
#spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA / Hibernate Config
# The app uses the in-memory H2 datasource above during local development
spring.jpa.show-sql=true

# ============================================================================
# EMAIL CONFIGURATION (SMTP via environment variables)
# ============================================================================
# Set these environment variables before starting the backend:
#   export MAIL_ENABLED=true
#   export SMTP_HOST=smtp.gmail.com
#   export SMTP_PORT=587
#   export SMTP_USERNAME=your-email@gmail.com
#   export SMTP_PASSWORD=your-gmail-app-password
#   export GOOGLE_CLIENT_ID=your-google-oauth-web-client-id.apps.googleusercontent.com
#
# For Gmail, use a Google App Password, not your normal account password.
# If MAIL_ENABLED is false or SMTP is not configured, MailService will fall
# back to printing OTP/reset codes to the console for local testing.
# ============================================================================
app.mail.enabled=${MAIL_ENABLED:false}
spring.mail.host=${SMTP_HOST:smtp.gmail.com}
spring.mail.port=${SMTP_PORT:587}
spring.mail.username=${SMTP_USERNAME:}
spring.mail.password=${SMTP_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000

# Google OAuth client id for Google Sign-In
app.google.client-id=${GOOGLE_CLIENT_ID:723490095928-fnclof33hdr2gmkvjd2721684cv9vdv1.apps.googleusercontent.com}

